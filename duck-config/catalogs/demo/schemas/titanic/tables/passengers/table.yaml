apiVersion: duck/v1
kind: Table
metadata:
  name: passengers
  deletion_protection: false
spec:
  table_type: MANAGED
  comment: "Titanic passenger manifest with survival data"
  columns:
    - name: passenger_id
      type: BIGINT
    - name: survived
      type: BOOLEAN
    - name: pclass
      type: INTEGER
    - name: name
      type: VARCHAR
    - name: sex
      type: VARCHAR
    - name: age
      type: DOUBLE
    - name: sib_sp
      type: INTEGER
    - name: parch
      type: INTEGER
    - name: ticket
      type: VARCHAR
    - name: fare
      type: DOUBLE
    - name: cabin
      type: VARCHAR
    - name: embarked
      type: VARCHAR

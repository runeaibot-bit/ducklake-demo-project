apiVersion: duck/v1
kind: ColumnMaskList
masks:
  # Mask passenger names for viewers
  - name: mask-name
    column_name: name
    mask_expression: "'***REDACTED***'"
    bindings:
      - principal: viewers
        principal_type: group
        see_original: false

  # Mask ticket numbers for viewers
  - name: mask-ticket
    column_name: ticket
    mask_expression: "'TICKET-***'"
    bindings:
      - principal: viewers
        principal_type: group
        see_original: false

  # Mask cabin info for viewers
  - name: mask-cabin
    column_name: cabin
    mask_expression: "'***'"
    bindings:
      - principal: viewers
        principal_type: group
        see_original: false

apiVersion: duck/v1
kind: GrantList
grants:
  # Admins
  - principal: admins
    principal_type: group
    securable_type: schema
    securable: demo.bronze
    privilege: ALL_PRIVILEGES

  - principal: admins
    principal_type: group
    securable_type: schema
    securable: demo.silver
    privilege: ALL_PRIVILEGES

  - principal: admins
    principal_type: group
    securable_type: schema
    securable: demo.gold
    privilege: ALL_PRIVILEGES

  # Content analysts
  - principal: content_analysts
    principal_type: group
    securable_type: schema
    securable: demo.bronze
    privilege: USAGE

  - principal: content_analysts
    principal_type: group
    securable_type: schema
    securable: demo.silver
    privilege: USAGE

  - principal: content_analysts
    principal_type: group
    securable_type: schema
    securable: demo.gold
    privilege: USAGE

  - principal: content_analysts
    principal_type: group
    securable_type: table
    securable: demo.bronze.ratings_raw
    privilege: SELECT

  - principal: content_analysts
    principal_type: group
    securable_type: table
    securable: demo.silver.movies
    privilege: SELECT

  - principal: content_analysts

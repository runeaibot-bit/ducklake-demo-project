    privilege: SELECT

  - principal: content_analysts
    principal_type: group
    securable_type: table
    securable: demo.gold.mart_genre_trends
    privilege: SELECT

  # Marketing analysts
  - principal: marketing_analysts
    principal_type: group
    securable_type: schema
    securable: demo.bronze
    privilege: USAGE

  - principal: marketing_analysts
    principal_type: group
    securable_type: schema
    securable: demo.silver
    privilege: USAGE

  - principal: marketing_analysts
    principal_type: group
